{% extends 'base.html' %}{% block content %}<h1>Company inbox</h1><p>Read-only imported messages for the currently selected company.</p><p><a href="/integrations">Connections</a></p><div class="card">{% for m in messages %}<div class="email"><a href="/integrations/inbox/{{m.id}}"><strong>{{m.subject}}</strong></a><p>{{m.sender}} · {{m.category}}</p></div>{% else %}<p>No messages yet.</p>{% endfor %}</div>{% endblock %}
